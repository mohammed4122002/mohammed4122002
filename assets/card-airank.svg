mate attributeName="y" values="42;10;31;42" dur="3.20s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.4;.7;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></rect><rect x="85" y="30" width="11" height="26" rx="3" fill="#D4AF37" opacity=".9"><animate attributeName="height" values="8;26;14;8" dur="3.45s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.4;.7;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/><animate attributeName="y" values="48;30;42;48" dur="3.45s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.4;.7;1" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/></rect></g></g></g>
