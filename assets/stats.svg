<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150" role="img" aria-label="Highlights">
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131c2e"/><stop offset="1" stop-color="#0e1422"/></linearGradient>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#B8912B"/><stop offset=".35" stop-color="#F5D87A"/><stop offset=".5" stop-color="#FFF6D6"/><stop offset=".65" stop-color="#F5D87A"/><stop offset="1" stop-color="#B8912B"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="4.5s" repeatCount="indefinite"/></linearGradient>
<clipPath id="cc0"><rect x="8" y="8" width="233" height="134" rx="16"/></clipPath><clipPath id="cc1"><rect x="255" y="8" width="233" height="134" rx="16"/></clipPath><clipPath id="cc2"><rect x="502" y="8" width="233" height="134" rx="16"/></clipPath><clipPath id="cc3"><rect x="749" y="8" width="233" height="134" rx="16"/></clipPath></defs>
