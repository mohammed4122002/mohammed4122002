<svg xmlns="http://www.w3.org/2000/svg" width="900" height="74" viewBox="0 0 900 74" role="img" aria-label="Certifications">
<defs><linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
<stop offset="0" stop-color="#B8912B"/><stop offset=".35" stop-color="#F5D87A"/><stop offset=".5" stop-color="#FFF6D6"/><stop offset=".65" stop-color="#F5D87A"/><stop offset="1" stop-color="#B8912B"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="4.5s" repeatCount="indefinite"/></linearGradient><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="10" y1="0" x2="890" y2="0"><stop offset="0" stop-color="#D4AF37"/><stop offset=".7" stop-color="#D4AF37" stop-opacity=".35"/><stop offset="1" stop-color="#D4AF37" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:860}to{stroke-dashoffset:0}}
.t{animation:in .8s both cubic-bezier(.2,.8,.2,1)}.ln{stroke-dasharray:860;animation:draw 1.4s .2s both ease-out}</style>
<g transform="translate(26 30)"><rect x="-9" y="-9" width="18" height="18" fill="none" stroke="#D4AF37" stroke-width="2" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="45" to="405" dur="8s" repeatCount="indefinite"/></rect><rect x="-3.5" y="-3.5" width="7" height="7" fill="#F5D87A"><animateTransform attributeName="transform" type="rotate" from="45" to="-315" dur="4s" repeatCount="indefinite"/></rect></g>
<circle cx="26" cy="30" r="9" fill="none" stroke="#D4AF37"><animate attributeName="r" values="9;34" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0" dur="2.6s" repeatCount="indefinite"/></circle>
<circle r="3" cy="66" fill="#F5D87A" filter="url(#glow)"><animate attributeName="cx" values="890;10" dur="4.6s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4.6s" begin="2s" repeatCount="indefinite"/></circle>
<text class="t" x="60" y="22" font-family="'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12" letter-spacing="5" fill="#8B949E">06  ·  LEARNING</text>
<text class="t" x="58" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="1" fill="url(#shimmer)" style="animation-delay:.1s">Certifications</text>
<path class="ln" d="M10 66H890" stroke="url(#ln)" stroke-width="2" fill="none"/>
<circle r="3.5" cy="66" fill="#FFF3C4" filter="url(#glow)"><animate attributeName="cx" values="10;890" dur="3.4s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="3.4s" begin="1.4s" repeatCount="indefinite"/></circle>
</svg>