ributeName="height" values="2.6;10.6;4.2;2.6" dur="1.26s" repeatCount="indefinite"/><animate attributeName="y" values="28.7;24.7;27.9;28.7" dur="1.26s" repeatCount="indefinite"/></rect><rect x="60.0" y="11.5" width="4" height="37.0" rx="2" fill="#D4AF37"><animate attributeName="height" values="9.2;37.0;14.8;9.2" dur="1.44s" repeatCount="indefinite"/><animate attributeName="y" values="25.4;11.5;22.6;25.4" dur="1.44s" repeatCount="indefinite"/></rect><rect x="67.5" y="8.5" width="4" height="43.0" rx="2" fill="#D4AF37"><animate attributeName="height" values="10.7;43.0;17.2;10.7" dur="1.62s" repeatCount="indefinite"/><animate attributeName="y" values="24.6;8.5;21.4;24.6" dur="1.62s" repeatCount="indefinite"/></rect><rect x="75.0" y="18.0" width="4" height="24.0" rx="2" fill="#D4AF37"><animate attributeName="height" values="6.0;24.0;9.6;6.0" dur="0.90s" repeatCount="indefinite"/><animate attributeName="y" values="27.0;18.0;25.2;27.0" dur="0.90s" repeatCount="indefinite"/></rect><rect x="82.5" y="17.2" width="4" height="25.6" rx="2" fill="#D4AF37"><animate attributeName="height" values="6.4;25.6;10.2;6.4" dur="1.08s" repeatCount="indefinite"/><animate attributeName="y" values="26.8;17.2;24.9;26.8" dur="1.08s" repeatCount="indefinite"/></rect><rect x="90.0" y="8.3" width="4" height="43.4" rx="2" fill="#D4AF37"><animate attributeName="height" values="10.8;43.4;17.3;10.8" dur="1.26s" repeatCount="indefinite"/><animate attributeName="y" values="24.6;8.3;21.3;24.6" dur="1.26s" repeatCount="indefinite"/></rect><rect x="97.5" y="12.0" width="4" height="35.9" rx="2" fill="#D4AF37"><animate attributeName="height" values="9.0;35.9;14.4;9.0" dur="1.44s" repeatCount="indefinite"/><animate attributeName="y" values="25.5;12.0;22.8;25.5" dur="1.44s" repeatCount="indefinite"/></rect></g></g></g>
